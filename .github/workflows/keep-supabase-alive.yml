# Mencegah proyek Supabase Free Tier di-pause otomatis saat sepi (>7 hari tanpa aktivitas).
# Butuh Repository Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions).
name: keep-supabase-alive

on:
  schedule:
    - cron: '17 3 */3 * *' # tiap 3 hari, 03:17 UTC (10:17 WIB)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_ANON_KEY belum diisi"; exit 1
          fi
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/world_states?select=world_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"; cat /tmp/body.json; echo
          test "$code" = "200"
